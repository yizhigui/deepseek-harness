# TEMPORARY validation-only workflow.
#
# It exists solely on the throwaway branch `ci/peer-contract-validation` and is
# never merged into master, desktop/electron-wrapper or
# desktop/plugin-react-peer-compat.
#
# The code under test is NOT this branch: the checkout below pins the gate-fixed
# commit explicitly, and the first step proves both the resulting SHA and that
# the workflow itself did not dirty the tested tree.
name: Peer Contract Validation

on:
  push:
    branches:
      - ci/peer-contract-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frozen peer-contract commit
        uses: actions/checkout@v6
        with:
          ref: cecaa390c7efedcf132bf387084c10228721f30a

      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "cecaa390c7efedcf132bf387084c10228721f30a"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-assert tested SHA and clean tree before the gates
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "cecaa390c7efedcf132bf387084c10228721f30a"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"

      - name: pnpm run typecheck
        run: pnpm run typecheck

      - name: pnpm run verify-third-party-notices
        run: pnpm run verify-third-party-notices

      - name: pnpm run test
        run: pnpm run test
