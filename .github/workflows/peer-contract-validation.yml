# TEMPORARY validation-only workflow.
#
# It exists solely on the throwaway branch `ci/peer-contract-validation` and is
# never merged. The code under test is NOT this branch: every job pins the
# tested commit explicitly and proves the resulting SHA and a clean tree.
#
# The gate list is the official PR CI blocking contract from
# `.github/workflows/ci.yml` at the tested commit, mirrored onto standard
# GitHub-hosted runners because the official jobs request DeepSeek runner
# labels (`dsh-ubuntu-24-04-16core`, `dsh-windows-2025-16core`) that a fork
# does not own. Blocking = the jobs listed in `all-checks-passed.needs`:
#
#   official job            official command                        mirrored here
#   node-24                 pnpm run check:ci:static               linux-static
#   node-24-coverage        pnpm run check:ci:coverage             linux-coverage
#   node-24-bench           pnpm run check:ci:bench                linux-bench
#   node-24-consumers       pnpm run check:ci:consumers            linux-consumers
#   node-compat (x3)        pnpm run check:node-compat             linux-node-compat
#   python-sdk              uv run ... pytest                      python-sdk
#   python-runtime          reusable build-exe-for-python-sdk.yml   NOT RUNNABLE
#                           (requires secrets.DEEPSEEK_API_KEY_EXTERNAL)
#   windows-build           pnpm run check:ci:windows-blocking     windows-build
#   windows-native-tests    pnpm exec vitest run <4 specs>         windows-native-tests
#
# Deliberately NOT part of this run:
#   * windows-coverage is not in `all-checks-passed.needs`, and
#     windows-observational sets `continue-on-error: true` - neither is blocking.
#   * `check:ci:linux-primary` is not used by ci.yml at all (only ci-master.yml
#     uses it), so it is not the PR blocking aggregate and is not adopted here.
#
# Deviations from the official jobs are limited to runner selection (hosted
# labels instead of the DeepSeek labels) and to skipping the pnpm/Playwright
# `actions/cache/restore` steps, which are performance-only and change no gate
# result. Gate commands, gate env, Node version, pnpm version (from the
# repository's `packageManager` field), the bubblewrap preparation, the Windows
# Developer Mode step, and the Playwright installs are copied verbatim.
name: Peer Contract Validation

on:
  push:
    branches:
      - ci/peer-contract-validation

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  TESTED_SHA: cecaa390c7efedcf132bf387084c10228721f30a
  # `github.event.pull_request.base.sha` for this commit: the merge base of the
  # tested commit and the fork's default branch. ci.yml passes this to the
  # frozen-archive gate.
  ARCHIVE_BASE_REF: c291e7961a515f6d7af9304e7fd1d257929aef26

jobs:
  linux-static:
    name: "node 24 / static (official: check:ci:static)"
    runs-on: ubuntu-latest
    env:
      DSH_GATE_CONCURRENCY: '8'
      DSH_GATE_FAIL_FAST: '1'
      DSH_ARCHIVE_BASE_REF: c291e7961a515f6d7af9304e7fd1d257929aef26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Configure pnpm store path
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Re-assert tested SHA and clean tree before the gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run static gates
        run: pnpm run check:ci:static

  linux-coverage:
    name: "node 24 / coverage (official: check:ci:coverage)"
    runs-on: ubuntu-latest
    env:
      DSH_COVERAGE_MAX_WORKERS: '6'
      DSH_COVERAGE_PARTITIONS: '4'
      DSH_GATE_CONCURRENCY: '3'
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Configure pnpm store path
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Re-assert tested SHA and clean tree before the gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run exhaustive coverage
        run: pnpm run check:ci:coverage

  linux-consumers:
    name: "node 24 / snapshots and artifacts (official: check:ci:consumers)"
    runs-on: ubuntu-latest
    env:
      DSH_GATE_CONCURRENCY: '10'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '8'
      DSH_PUBLINT_CONCURRENCY: '8'
      DSH_WEB_SNAPSHOT_WORKERS: '6'
      DSH_GATE_FAIL_FAST: '1'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '32'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP%/*}/ms-playwright" >> "$GITHUB_ENV"
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Configure pnpm store path
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Install web frontend browsers
        run: |
          pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
          pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium
      - name: Re-assert tested SHA and clean tree before the gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers

  linux-bench:
    name: "node 24 / benchmarks (official: check:ci:bench)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Configure pnpm store path
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium
      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

  linux-node-compat:
    name: "node ${{ matrix.name }} (official: check:node-compat)"
    runs-on: ubuntu-latest
    env:
      DSH_GATE_CONCURRENCY: ${{ matrix.gate_concurrency }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_GATE_FAIL_FAST: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19'
            name: '22.19'
            gate_concurrency: '1'
          - node: '24.9'
            name: '24.9'
            gate_concurrency: '1'
          - node: '26'
            name: '26'
            gate_concurrency: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat
      - name: Check Loader internal shape detection
        run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  python-sdk:
    name: "python 3.10 / keyless SDK (official: python-sdk)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Prove tested SHA and clean tree
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  windows-build:
    name: "windows node 24 / build (official: check:ci:windows-blocking)"
    runs-on: windows-latest
    env:
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - name: Prove tested SHA and clean tree
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Re-assert tested SHA and clean tree before the gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run blocking Windows builds
        shell: pwsh
        run: pnpm run check:ci:windows-blocking

  windows-native-tests:
    name: "windows node 24 / native tests (official: windows-native-tests)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - name: Prove tested SHA and clean tree
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = ${sha}"
          test "${sha}" = "${TESTED_SHA}"
          status="$(git status --porcelain)"
          echo "git status --porcelain = [${status}]"
          test -z "${status}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Run Windows-specific native tests
        shell: pwsh
        run: >-
          pnpm exec vitest run
          --no-file-parallelism
          --testTimeout 90000
          packages/shell/tool-pwsh/tests/loader.spec.ts
          packages/workflow/workflow-worker-thread/tests/workflow-worker-thread.spec.ts
          packages/workflow/tool-ralph/tests/integration.spec.ts
          packages/subprocess/subprocess-local/tests/process-exit.spec.ts

  official-contract-summary:
    name: official blocking contract summary
    runs-on: ubuntu-latest
    needs:
      - linux-static
      - linux-coverage
      - linux-consumers
      - linux-bench
      - linux-node-compat
      - python-sdk
      - windows-build
      - windows-native-tests
    if: ${{ !cancelled() }}
    steps:
      - name: Report mirrored official blocking lanes
        run: |
          echo "official blocking lanes (ci.yml all-checks-passed.needs):"
          echo "  linux-static         = ${{ needs.linux-static.result }}"
          echo "  linux-coverage       = ${{ needs.linux-coverage.result }}"
          echo "  linux-consumers      = ${{ needs.linux-consumers.result }}"
          echo "  linux-bench          = ${{ needs.linux-bench.result }}"
          echo "  linux-node-compat    = ${{ needs.linux-node-compat.result }}"
          echo "  python-sdk           = ${{ needs.python-sdk.result }}"
          echo "  windows-build        = ${{ needs.windows-build.result }}"
          echo "  windows-native-tests = ${{ needs.windows-native-tests.result }}"
